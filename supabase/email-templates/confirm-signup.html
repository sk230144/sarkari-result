<!--
  Supabase → Authentication → Emails → "Confirm signup"

  Paste this in place of the default template.

  The default sends {{ .ConfirmationURL }} — a magic link. The signup flow
  in this app asks for a 6-digit code instead, so the template must send
  {{ .Token }}. A link-only email would leave people staring at a code box
  with no code to type.

  Supabase generates both for every signup, so switching the template is
  the only change needed — no code, no settings.
-->
<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;max-width:480px;margin:0 auto;padding:32px 24px;background:#0c0e0b;color:#f9f9f6;border-radius:16px">

  <div style="text-align:center;margin-bottom:28px">
    <span style="font-size:22px;font-weight:700;letter-spacing:-0.02em">
      jobalert<span style="color:#a3e635">24</span>
    </span>
  </div>

  <h2 style="margin:0 0 8px;font-size:18px;font-weight:700;text-align:center">
    Confirm your email
  </h2>
  <p style="margin:0 0 24px;font-size:13px;line-height:1.6;color:#8c9c90;text-align:center">
    Enter this code to finish creating your account.
  </p>

  <!-- The code itself: large, spaced, easy to read off a phone. -->
  <div style="background:#0f1410;border:1px solid #1e2920;border-radius:12px;padding:20px;text-align:center;margin-bottom:24px">
    <div style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:32px;font-weight:700;letter-spacing:10px;color:#a3e635">
      {{ .Token }}
    </div>
  </div>

  <p style="margin:0 0 6px;font-size:12px;line-height:1.6;color:#8c9c90;text-align:center">
    This code expires in 60 minutes.
  </p>
  <p style="margin:0;font-size:12px;line-height:1.6;color:#647668;text-align:center">
    If you didn't create an account, you can ignore this email.
  </p>

  <hr style="border:none;border-top:1px solid #1e2920;margin:28px 0 16px" />
  <p style="margin:0;font-size:11px;color:#647668;text-align:center">
    jobalert24 · India tech jobs, DSA sheets and interview prep
  </p>
</div>
